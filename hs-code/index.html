<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Saraaf Trade Toolkit | HS Code Lookup</title>
<link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/toolkit.css">
</head>
<body class="tool-page" data-tool-id="hs-code">
<header class="app-header"><a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><img src="../Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div></a><nav class="header-nav"><a class="nav-tab active" href="../">All Tools</a></nav></header>
<main class="tool-main">
<div class="tool-header"><div><h1 data-tool-title>HS Code Lookup</h1><p>Browse HS 2022 from Section → Chapter → 4-digit Heading.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div>
<section class="card"><div class="hs-intro"><strong>HS 2022</strong><span>21 Sections containing 96 Chapters and 1,228 four-digit headings.</span><span>National 8-digit+ tariff extensions are not included here.</span></div><input id="hs-search" class="hs-search" type="search" placeholder="Search by HS code or description..."></section>
<section id="hs-status" class="card"><strong>Loading HS 2022...</strong><p>The lookup is loading the global hierarchy.</p></section>
<section id="hs-list" class="hs-list" aria-live="polite"></section>
<section id="hs-trade-panel" class="card hs-trade-panel" hidden></section>
</main>
<script src="../assets/js/hs-code.js"></script><script src="../assets/js/toolkit-common.js"></script>
</body></html>
