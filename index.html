<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saraaf Trade Toolkit | Commodity Tools</title>
  <meta name="description" content="Commercial-grade trade utilities and commodity calculation toolkit for global commerce.">
  <meta name="theme-color" content="#1a2a33">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/toolkit.css">
</head>
<body>
  <header class="app-header">
    <a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none">
      <img src="./Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo">
      <div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div>

    <nav class="header-nav" aria-label="Toolkit navigation">
      <a class="nav-tab active" href="./">All Tools</a>

  <main class="app-main">
    <section class="tool-view">
      <div class="card">
        <h1 class="card-title">Trade Utilities Suite</h1>
        <p class="card-subtitle">Professional tools built for people who buy, sell, move, process and finance commodities.</p>
        <div id="tool-wall" class="hub-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="./assets/js/tool-registry.js"></script>
  <script src="./assets/js/app.js"></script>
