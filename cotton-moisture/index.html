<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saraaf Trade Toolkit | Cotton Bale Moisture & Weight Adjustment</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/toolkit.css"></head>
<body class="tool-page" data-tool-id="cotton-moisture" data-suite="cotton"><header class="app-header"><a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><img src="../Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div></a><nav class="header-nav"><a class="nav-tab active" href="../">All Tools</a></nav></header>
<main class="tool-main"><div class="tool-header"><div><h1 data-tool-title>Cotton Bale Moisture & Weight Adjustment</h1><p>Separate the lint's dry matter from water weight and compare it with a reference moisture basis.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div>
<section class="card"><form class="form-grid" onsubmit="event.preventDefault();calculateCottonMoisture()"><div class="form-group"><label for="wet-weight">Observed Bale Weight (kg)</label><input id="wet-weight" type="number" min="0" step="0.1" value="500" oninput="calculateCottonMoisture()"></div><div class="form-group"><label for="actual-moisture">Measured Moisture (% wet basis)</label><input id="actual-moisture" type="number" min="0" max="50" step="0.1" value="10" oninput="calculateCottonMoisture()"></div><div class="form-group"><label for="reference-moisture">Reference Moisture (% wet basis)</label><input id="reference-moisture" type="number" min="0" max="50" step="0.1" value="8" oninput="calculateCottonMoisture()"></div><div class="form-group full-width"><button class="btn-primary" type="submit">Adjust Weight</button></div></form></section>
<section class="card results-card"><div class="results-header"><h2>Moisture Results</h2></div><div class="result-hero"><span class="result-label">Reference-Basis Equivalent Weight</span><span id="cotton-ref-weight" class="result-value">0 kg</span><div id="cotton-moisture-note"></div></div><div class="results-grid"><div><span class="result-label">Dry matter</span><span id="cotton-dry" class="result-value">0 kg</span></div><div><span class="result-label">Water in observed bale</span><span id="cotton-water" class="result-value">0 kg</span></div></div><div class="breakdown-container"><h3>Calculation</h3><ol id="cotton-moisture-breakdown" class="breakdown-list"></ol></div></section></main>
<script src="../assets/js/cotton-moisture.js"></script><script src="../assets/js/toolkit-common.js"></script></body></html>
