<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saraaf Trade Toolkit | Cotton Gin Yield & Bale Planner</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/toolkit.css"></head>
<body class="tool-page" data-tool-id="cotton-gin-yield" data-suite="cotton"><header class="app-header"><a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><img src="../Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div></a><nav class="header-nav"><a class="nav-tab active" href="../">All Tools</a></nav></header>
<main class="tool-main"><div class="tool-header"><div><h1 data-tool-title>Cotton Gin Yield & Bale Planner</h1><p>Estimate lint output and bale count from seed cotton and gin turnout.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div>
<section class="card"><form class="form-grid" onsubmit="event.preventDefault();calculateCottonGin()"><div class="form-group"><label for="seed-cotton">Seed Cotton Available (MT)</label><input id="seed-cotton" type="number" min="0" step="any" value="1000" oninput="calculateCottonGin()"></div><div class="form-group"><label for="turnout">Expected Gin Turnout (%)</label><input id="turnout" type="number" min="20" max="50" step="0.1" value="35" oninput="calculateCottonGin()"></div><div class="form-group"><label for="bale-weight">Target Bale Net Weight (kg)</label><input id="bale-weight" type="number" min="1" step="0.1" value="226.8" oninput="calculateCottonGin()"></div><div class="form-group full-width"><button class="btn-primary" type="submit">Calculate Yield</button></div></form></section>
<section class="card results-card"><div class="results-header"><h2>Gin Planning Results</h2></div><div class="result-hero"><span class="result-label">Estimated Ginned Lint</span><span id="gin-lint" class="result-value">0 MT</span><div id="gin-note"></div></div><div class="results-grid"><div><span class="result-label">Estimated bales</span><span id="gin-bales" class="result-value">0</span></div><div><span class="result-label">Estimated lint per bale</span><span id="gin-bale-mt" class="result-value">0 MT</span></div></div><div class="breakdown-container"><h3>Calculation</h3><ol id="gin-breakdown" class="breakdown-list"></ol></div></section></main>
<script src="../assets/js/cotton-gin-yield.js"></script><script src="../assets/js/toolkit-common.js"></script></body></html>
