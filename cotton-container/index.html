<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saraaf Trade Toolkit | Cotton Container Load Planner</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/toolkit.css"></head>
<body class="tool-page" data-tool-id="cotton-container" data-suite="cotton"><header class="app-header"><a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><img src="../Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div></a><nav class="header-nav"><a class="nav-tab active" href="../">All Tools</a></nav></header>
<main class="tool-main"><div class="tool-header"><div><h1 data-tool-title>Cotton Container Load Planner</h1><p>Estimate cotton bales per container using practical volume fill and payload limits.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div>
<section class="card"><form class="form-grid" onsubmit="event.preventDefault();calculateCottonContainer()"><div class="form-group"><label for="container-target">Required Shipment (MT)</label><input id="container-target" type="number" min="0" step="any" value="120" oninput="calculateCottonContainer()"></div><div class="form-group"><label for="container-bale-weight">Bale Net Weight (kg)</label><input id="container-bale-weight" type="number" min="1" step="0.1" value="226.8" oninput="calculateCottonContainer()"></div><div class="form-group"><label for="container-bale-volume">Bale Volume (m³)</label><input id="container-bale-volume" type="number" min="0.01" step="0.01" value="0.48" oninput="calculateCottonContainer()"></div><div class="form-group"><label for="container-volume">Container Internal Volume (m³)</label><input id="container-volume" type="number" min="1" step="0.1" value="67.7" oninput="calculateCottonContainer()"></div><div class="form-group"><label for="container-payload">Container Payload Limit (kg)</label><input id="container-payload" type="number" min="1" step="1" value="28870" oninput="calculateCottonContainer()"></div><div class="form-group"><label for="container-fill">Practical Space Fill (%)</label><input id="container-fill" type="number" min="1" max="100" step="1" value="80" oninput="calculateCottonContainer()"></div><div class="form-group full-width"><button class="btn-primary" type="submit">Plan Containers</button></div></form></section>
<section class="card results-card"><div class="results-header"><h2>Container Plan</h2></div><div class="result-hero"><span class="result-label">Estimated Containers Required</span><span id="container-count" class="result-value">0</span><div id="container-limit-note"></div></div><div class="results-grid"><div><span class="result-label">Bales per container</span><span id="container-bales" class="result-value">0</span></div><div><span class="result-label">MT per container</span><span id="container-mt" class="result-value">0</span></div></div><div class="breakdown-container"><h3>Capacity Check</h3><ol id="container-breakdown" class="breakdown-list"></ol></div></section></main>
<script src="../assets/js/cotton-container.js"></script><script src="../assets/js/toolkit-common.js"></script></body></html>
