<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Saraaf Trade Toolkit | Landed Cost Calculator</title>
<link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/toolkit.css">
</head>
<body class="tool-page" data-tool-id="landed-cost">
<header class="app-header"><a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><img src="../Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div></a><nav class="header-nav"><a class="nav-tab active" href="../">All Tools</a></nav></header>
<main class="tool-main">
<div class="tool-header"><div><h1 data-tool-title>Landed Cost Calculator</h1><p>Calculate the estimated landed cost of a shipment by combining product value and destination charges.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div>
<section class="card"><form id="landed-form" class="form-grid" onsubmit="event.preventDefault();calculateLandedCost()">
<div class="form-group"><label for="product-value">Product Value</label><input id="product-value" type="number" min="0" step="any" value="740000" oninput="calculateLandedCost()" required></div>
<div class="form-group"><label for="currency">Currency</label><select id="currency" onchange="calculateLandedCost()"><option>USD</option><option>EUR</option><option>GBP</option><option>PKR</option><option>CNY</option><option>AED</option><option>THB</option></select></div>
<div class="form-group"><label for="freight-cost">Freight Cost</label><input id="freight-cost" type="number" min="0" step="any" value="2100" oninput="calculateLandedCost()"></div>
<div class="form-group"><label for="insurance-cost">Insurance Cost</label><input id="insurance-cost" type="number" min="0" step="any" value="300" oninput="calculateLandedCost()"></div>
<div class="form-group"><label for="import-duty">Import Duty</label><input id="import-duty" type="number" min="0" step="any" value="1000" oninput="calculateLandedCost()"></div>
<div class="form-group"><label for="other-charges">Other Charges</label><input id="other-charges" type="number" min="0" step="any" value="250" oninput="calculateLandedCost()"></div>
<div class="form-group full-width"><button type="submit" class="btn-primary">Calculate Landed Cost</button></div>
</form></section>
<section id="results-card" class="card results-card"><div class="results-header"><h2>Landed Cost Results</h2></div><div class="result-hero"><span class="result-label">Estimated Landed Cost</span><span id="output-total" class="result-value">0.00</span><div id="output-currency">USD</div></div><div class="breakdown-container"><h3>Mathematical Breakdown &amp; Steps</h3><ol id="breakdown-list" class="breakdown-list"></ol></div></section>
</main>
<script src="../assets/js/landed-cost.js"></script><script src="../assets/js/toolkit-common.js"></script>
</body></html>
