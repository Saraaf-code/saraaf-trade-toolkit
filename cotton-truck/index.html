<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Saraaf Trade Toolkit | Cotton Truck Shipment Planner</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../assets/css/variables.css"><link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/toolkit.css"></head>
<body class="tool-page" data-tool-id="cotton-truck" data-suite="cotton"><header class="app-header"><a href="https://saraafglobal.com" class="header-brand" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><img src="../Saraaf TM logo.jpg" alt="Saraaf Logo" class="brand-logo"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Trade Toolkit</span></div></a><nav class="header-nav"><a class="nav-tab active" href="../">All Tools</a></nav></header>
<main class="tool-main"><div class="tool-header"><div><h1 data-tool-title>Cotton Truck Shipment Planner</h1><p>Plan how many road trucks are needed when bale weight, truck payload and truck space all matter.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div>
<section class="card"><form class="form-grid" onsubmit="event.preventDefault();calculateCottonTruck()"><div class="form-group"><label for="truck-target">Required Shipment (MT)</label><input id="truck-target" type="number" min="0" step="any" value="120" oninput="calculateCottonTruck()"></div><div class="form-group"><label for="truck-bale-weight">Bale Net Weight (kg)</label><input id="truck-bale-weight" type="number" min="1" step="0.1" value="226.8" oninput="calculateCottonTruck()"></div><div class="form-group"><label for="truck-bale-volume">Bale Volume (m³)</label><input id="truck-bale-volume" type="number" min="0.01" step="0.01" value="0.48" oninput="calculateCottonTruck()"></div><div class="form-group"><label for="truck-payload">Truck Payload Limit (kg)</label><input id="truck-payload" type="number" min="1" step="1" value="30000" oninput="calculateCottonTruck()"></div><div class="form-group"><label for="truck-volume">Usable Truck Body Volume (m³)</label><input id="truck-volume" type="number" min="0.1" step="0.1" value="70" oninput="calculateCottonTruck()"></div><div class="form-group"><label for="truck-fill">Practical Space Fill (%)</label><input id="truck-fill" type="number" min="1" max="100" step="1" value="80" oninput="calculateCottonTruck()"></div><div class="form-group full-width"><button class="btn-primary" type="submit">Plan Trucks</button></div></form></section>
<section class="card results-card"><div class="results-header"><h2>Shipment Plan</h2></div><div class="result-hero"><span class="result-label">Estimated Trucks Required</span><span id="truck-count" class="result-value">0</span><div id="truck-limit-note"></div></div><div class="results-grid"><div><span class="result-label">Bales per truck</span><span id="truck-bales" class="result-value">0</span></div><div><span class="result-label">MT per truck</span><span id="truck-mt" class="result-value">0</span></div></div><div class="breakdown-container"><h3>Capacity Check</h3><ol id="truck-breakdown" class="breakdown-list"></ol></div></section></main>
<script src="../assets/js/cotton-truck.js"></script><script src="../assets/js/toolkit-common.js"></script></body></html>
