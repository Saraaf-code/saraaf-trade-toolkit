<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotton Truck Planner | Saraaf</title><link rel="stylesheet" href="../../assets/css/variables.css"><link rel="stylesheet" href="../../assets/css/main.css"><link rel="stylesheet" href="../../assets/css/toolkit.css"></head><body class="tool-page" data-suite="cotton" data-cotton-tool="truck-planner" data-tool-id="cotton-truck-planner"><header class="app-header"><a href="../" class="header-brand"><img src="../../Saraaf TM logo.jpg" class="brand-logo" alt="Saraaf"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Cotton Trade Operating System</span></div></a></header><main class="tool-main"><div class="tool-header"><div><h1 data-tool-title>Cotton Truck Planner</h1><p>Determine practical bale capacity from both truck space and payload.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div><section class="card"><div class="form-grid"><div class="form-group"><label for="shipment-mt">Required Shipment (MT)</label><input id="shipment-mt" type="number" value="120" min="0"></div><div class="form-group"><label for="bale-kg">Bale Weight (kg)</label><input id="bale-kg" type="number" value="227" min="1"></div><div class="form-group"><label for="bale-volume">Bale Volume (m³)</label><input id="bale-volume" type="number" value="0.48" min="0.01" step="0.01"></div><div class="form-group"><label for="vehicle-volume">Truck Body Volume (m³)</label><input id="vehicle-volume" type="number" value="70" min="0"></div><div class="form-group"><label for="vehicle-payload">Truck Payload (MT)</label><input id="vehicle-payload" type="number" value="25" min="0"></div><div class="form-group"><label for="fill">Practical Space Fill (%)</label><input id="fill" type="number" value="90" min="1" max="100"></div></div></section><section class="card results-card"><div class="result-hero"><span class="result-label">Trucks Required</span><span id="output-primary" class="result-value">0</span><div id="output-secondary"></div></div><p id="output-breakdown"></p></section></main><script src="../../assets/js/cotton-tools.js"></script><script src="../../assets/js/toolkit-common.js"></script></body></html>
