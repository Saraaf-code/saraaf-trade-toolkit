<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotton Container Planner | Saraaf</title><link rel="stylesheet" href="../../assets/css/variables.css"><link rel="stylesheet" href="../../assets/css/main.css"><link rel="stylesheet" href="../../assets/css/toolkit.css"></head><body class="tool-page" data-suite="cotton" data-cotton-tool="container-planner" data-tool-id="cotton-container-planner"><header class="app-header"><a href="../" class="header-brand"><img src="../../Saraaf TM logo.jpg" class="brand-logo" alt="Saraaf"><div><span class="brand-title">Saraaf</span><span class="brand-subtitle">Cotton Trade Operating System</span></div></a></header><main class="tool-main"><div class="tool-header"><div><h1 data-tool-title>Cotton Container Planner</h1><p>Plan cotton bale loading by comparing container volume and payload.</p></div><div class="tool-actions"><button id="printBtn" class="tool-action">Print / Save PDF</button><button id="shareBtn" class="tool-action primary">Share Quote</button></div></div><section class="card"><div class="form-grid"><div class="form-group"><label for="shipment-mt">Required Shipment (MT)</label><input id="shipment-mt" type="number" value="120" min="0"></div><div class="form-group"><label for="bale-kg">Bale Weight (kg)</label><input id="bale-kg" type="number" value="227" min="1"></div><div class="form-group"><label for="bale-volume">Bale Volume (m³)</label><input id="bale-volume" type="number" value="0.48" min="0.01" step="0.01"></div><div class="form-group"><label for="container-type">Container Type</label><select id="container-type"><option value="20">20 ft Standard</option><option value="40" selected>40 ft Standard</option><option value="custom">Custom</option></select></div><div class="form-group"><label for="vehicle-volume">Container Internal Volume (m³)</label><input id="vehicle-volume" type="number" value="67.7" min="0" readonly></div><div class="form-group"><label for="vehicle-payload">Container Payload (MT)</label><input id="vehicle-payload" type="number" value="28.87" min="0" readonly></div><div class="form-group"><label for="fill">Practical Space Fill (%)</label><input id="fill" type="number" value="90" min="1" max="100"></div></div></section><section class="card results-card"><div class="result-hero"><span class="result-label">Containers Required</span><span id="output-primary" class="result-value">0</span><div id="output-secondary"></div></div><p id="output-breakdown"></p></section></main><script src="../../assets/js/cotton-tools.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const t=document.getElementById('container-type'),v=document.getElementById('vehicle-volume'),p=document.getElementById('vehicle-payload');function sync(){if(t.value==='20'){v.value=33.2;p.value=28.3;v.readOnly=p.readOnly=true}else if(t.value==='40'){v.value=67.7;p.value=28.87;v.readOnly=p.readOnly=true}else{v.readOnly=p.readOnly=false}window.COTTON?.calc()}t.addEventListener('change',sync);sync()});</script><script src="../../assets/js/toolkit-common.js"></script></body></html>
